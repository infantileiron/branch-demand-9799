name: branch-demand
x-app: &app
  build: ./backend
  environment:
    DATABASE_URL: postgresql+psycopg://demand:${DB_PASSWORD:-demand_local_demo}@db:5432/demand
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: ${JWT_SECRET:-demand-demo-change-in-production-3109}
    SEED_DEMO: ${SEED_DEMO:-true}
  volumes: [artifacts:/artifacts]
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-branch-demand}-db
    environment:
      POSTGRES_DB: demand
      POSTGRES_USER: demand
      POSTGRES_PASSWORD: ${DB_PASSWORD:-demand_local_demo}
    ports: ["${DB_PORT:-17708}:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U demand -d demand"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-branch-demand}-redis
    command: [redis-server, --appendonly, "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-branch-demand}-backend
    ports: ["${BACKEND_PORT:-19208}:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 25
  worker:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-branch-demand}-worker
    command: [python, -m, src.worker]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import os,time; assert time.time()-os.path.getmtime('/tmp/heartbeat')<20"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-branch-demand}-frontend
    ports: ["${FRONTEND_PORT:-18208}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  dbdata:
  redisdata:
  artifacts:
networks:
  default:
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-10.253.109.0/24}
